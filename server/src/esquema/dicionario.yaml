# Dicionario de dados para o ERP ficticio
versao: "1.0"
tabela_padrao: "Todas as tabelas pertencem ao schema public"

tabelas:
  clientes:
    descricao: "Cadastro de clientes da empresa"
    colunas:
      - nome: cliente_id
        tipo: "SERIAL"
        descricao: "Identificador unico do cliente"
        primary_key: true
      - nome: codigo
        tipo: "VARCHAR(20)"
        descricao: "Codigo interno do cliente"
      - nome: razao_social
        tipo: "VARCHAR(150)"
        descricao: "Nome ou razao social do cliente"
      - nome: ativo
        tipo: "BOOLEAN"
        descricao: "Indica se o cliente esta ativo na operacao"

  produtos:
    descricao: "Cadastro de produtos da empresa"
    colunas:
      - nome: produto_id
        descricao: "Identificador unico do produto"
      - nome: codigo
        descricao: "Codigo de barras ou SKU do produto"
      - nome: descricao
        descricao: "Descricao completa do produto"
      - nome: preco_venda
        descricao: "Preco de venda do produto"
      - nome: estoque_minimo
        descricao: "Estoque minimo recomendado"
      - nome: ativo
        descricao: "Indica se o produto esta ativo"

  titulos:
    descricao: "Contas a pagar e receber"
    colunas:
      - nome: titulo_id
        descricao: "Identificador unico do titulo"
      - nome: tipo
        descricao: "Tipo do titulo: PAGAR ou RECEBER"
      - nome: data_vencimento
        descricao: "Data de vencimento do titulo"
      - nome: valor
        descricao: "Valor total do titulo"
      - nome: status
        descricao: "Status: ABERTO, PAGO, CANCELADO, VENCIDO"

  notas_fiscais:
    descricao: "Notas fiscais emitidas ou recebidas"
    colunas:
      - nome: nota_id
        descricao: "Identificador unico da nota"
      - nome: numero
        descricao: "Numero da nota"
      - nome: data_emissao
        descricao: "Data de emissao da nota"
      - nome: valor_total
        descricao: "Valor total da nota"
      - nome: status
        descricao: "Status: EMITIDA, CANCELADA, INUTILIZADA"

  itens_nota:
    descricao: "Itens de cada nota fiscal"
    colunas:
      - nome: item_id
        descricao: "Identificador unico do item"
      - nome: quantidade
        descricao: "Quantidade do produto na nota"
      - nome: valor_unitario
        descricao: "Valor unitario do produto"

  movimentos_estoque:
    descricao: "Movimentos de entrada e saida de estoque"
    colunas:
      - nome: movimento_id
        descricao: "Identificador unico do movimento"
      - nome: tipo
        descricao: "Tipo: ENTRADA ou SAIDA"
      - nome: quantidade
        descricao: "Quantidade movimentada"
      - nome: data_movimento
        descricao: "Data e hora do movimento"

visoes:
  v_saldo_estoque:
    descricao: "Saldo atual de todos os produtos ativos"
    colunas:
      - nome: produto_id
      - nome: codigo
      - nome: descricao
      - nome: saldo_atual
      - nome: estoque_minimo

  v_titulos_vencidos:
    descricao: "Titulos com datas de vencimento"
    colunas:
      - nome: titulo_id
      - nome: codigo
      - nome: tipo
      - nome: data_vencimento
      - nome: valor
      - nome: status
      - nome: dias_em_vencimento
      - nome: classificacao_vencimento

  v_indicadores_faturamento:
    descricao: "Indicadores de faturamento mensal"
    colunas:
      - nome: mes_ano
      - nome: quantidade_notas
      - nome: faturamento_bruto
      - nome: icms
      - nome: ipi
      - nome: clientes_distintos

  v_clientes_inadimplentes:
    descricao: "Clientes com titulos em aberto"
    colunas:
      - nome: cliente_id
      - nome: codigo
      - nome: razao_social
      - nome: cnpj
      - nome: titulos_em_aberto
      - nome: valor_em_aberto

termos_business:
  - termo: "cliente inadimplente"
    descricao: "Cliente com titulos em aberto com vencimento passado"
    sql: "SELECT * FROM v_clientes_inadimplentes"
  - termo: "saldo de estoque"
    descricao: "Quantidade disponivel de um ou mais produtos"
    sql: "SELECT * FROM v_saldo_estoque"