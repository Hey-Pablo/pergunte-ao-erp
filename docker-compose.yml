services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pergunte_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: pergunte_erp
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pergunte_user} -h localhost']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 5s

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pergunte_user}:${POSTGRES_PASSWORD}@db:5432/pergunte_erp?schema=public
      READER_USER: reader_user
      READER_PASSWORD: ${READER_PASSWORD:?Defina READER_PASSWORD no .env}
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:3001:3001'

volumes:
  postgres_data: