services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pergunte_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: pergunte_erp
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pergunte_user} -h localhost']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 5s

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      READER_DATABASE_URL: postgresql://reader_user:${READER_PASSWORD}@db:5432/pergunte_erp
      BASE_URL: ${BASE_URL:-http://host.docker.internal:3001/v1}
      API_KEY: ${API_KEY:-}
      MODEL: ${MODEL:-auto}
      PORT: 3002
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:3002:3002'

volumes:
  postgres_data: